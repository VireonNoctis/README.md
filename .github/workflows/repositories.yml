name: Refresh GitHub repository list

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/scripts/update_repositories.py
      - .github/scripts/update_code_stats.py
      - .github/code_stats_repositories.json
      - .github/workflows/repositories.yml

permissions:
  contents: write

concurrency:
  group: repository-readme-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile README
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate repository section
        env:
          GH_TOKEN: ${{ secrets.GH_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPOS_TOKEN: ${{ secrets.GH_REPOS_TOKEN }}
          GITHUB_OWNER: VireonNoctis
          README_PATH: README.md
        run: python .github/scripts/update_repositories.py
      - name: Generate code footprint across public projects
        env:
          GH_TOKEN: ${{ secrets.GH_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: VireonNoctis
          STATS_JSON_PATH: code-stats.json
          README_PATH: README.md
        run: python .github/scripts/update_code_stats.py
      - name: Commit refreshed README and code metrics
        run: |
          if git diff --quiet -- README.md && git diff --quiet -- code-stats.json; then
            echo 'Repository section is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md code-stats.json
          git commit -m 'docs: refresh repository and code metrics'
          git push
